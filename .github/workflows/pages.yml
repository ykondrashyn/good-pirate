name: Publish accepted preview
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Exact locally accepted preview tag
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout publication tools
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download and verify accepted release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^gp113-v[0-9]+\.[0-9]+\.[0-9]+-preview\.[0-9]+$ ]]
          git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}" > /tmp/release-commit
          mkdir downloaded
          gh release download "$RELEASE_TAG" --dir downloaded --pattern '*.zip' --pattern publication.json --pattern SHA256SUMS
          (cd downloaded && sha256sum --check SHA256SUMS)
          python3 tool/publication.py verify --bundle downloaded/good-pirate-webgl-${RELEASE_TAG#gp113-}.zip --manifest downloaded/publication.json --commit "$(cat /tmp/release-commit)" --tag "$RELEASE_TAG" --output _site
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload verified site
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site
  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy accepted release
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
